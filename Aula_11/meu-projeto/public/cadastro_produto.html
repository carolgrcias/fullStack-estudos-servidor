<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cadastro do Produto</title>
</head>
<body>
  <h1>Cadastrar Produto</h1>

  <form action="/cadastrar_produto" method="post">
    <input name="codigo" placeholder="Código"><br>
    <input name="descricao" placeholder="Descrição"><br>
    <input name="valor" placeholder="Valor"><br>
    <button type="submit">Cadastrar produto</button>
  </form>

</body>
</html>
