<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formulário</title>
</head>
<body>
    <h1>Testanto formulários</h1>

    <h2>Formulario GET</h2>
    <form action="/saudacao" method="GET">
        <p>Nome: <input type="text" name="nome"></p>
        <input type="submit" value="Enviar">
    </form>

    <h2>Formulario POST</h2>
    <form action="/saudacao" method="post">
        <p>Nome: <input type="text" name="nome"></p>
        <input type="submit" value="Enviar">
    </form>

    <h2>Cadastrar usuário</h2>
    <form method="get" action="/cadastro">
        <p>Nome: <input type="text" name="nome"></p>
        <p>Sobrenome: <input type="text" name="sobrenome"></p>
        <p>Nascimento: <input type="date" name="nascimento"></p>
        <p>Estado Civil: <input type="text" name="civil"></p>
        <input type="submit" value="Salvar">
    </form>
    
</body>
</html>
